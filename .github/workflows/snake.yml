name: Generate Contribution Snake

on:
  # Berjalan otomatis setiap hari pukul 00:00 UTC (07:00 WIB)
  schedule:
    - cron: "0 0 * * *"
  # Bisa dijalankan manual kapan saja lewat tab Actions
  workflow_dispatch:
  # Berjalan setiap kali ada push ke branch main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub Contributions Graph as a Snake Game
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push Snake SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
